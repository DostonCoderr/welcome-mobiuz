<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e30613" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <title>Mobiuz Welcome Book</title>

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #ff2a3a 0%, #e30613 45%, #9c030d 100%);
        z-index: 9999;
        transition: opacity 0.35s;
      }
      #initial-loader.hidden { opacity: 0; pointer-events: none; }
      .loader-flake {
        font-size: 44px;
        color: #fff;
        animation: spin 2.4s linear infinite;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,.25));
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="initial-loader"><div class="loader-flake">❄</div></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Telegram sozlamalari
      (function () {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) return;
        try {
          tg.ready();
          tg.expand();
          tg.setHeaderColor('#e30613');
          tg.setBackgroundColor('#f6f8fb');
        } catch (e) {}
      })();

      window.addEventListener('load', function () {
        setTimeout(function () {
          var loader = document.getElementById('initial-loader');
          if (loader) loader.classList.add('hidden');
        }, 300);
      });
    </script>
  </body>
</html>
